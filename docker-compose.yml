version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: housedemoll-postgres
    environment:
      POSTGRES_DB: housedb
      POSTGRES_USER: houseadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseadmin -d housedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - housedemo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: housedemoll-backend
    environment:
      # Environment Mode: Development for local, Production for Render
      # Default: Development (connects to local postgres service)
      # For Render: DATABASE_URL="postgres://user:pass@render-host/dbname" docker-compose up
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      
      # Database Connection: supports local (docker-compose postgres) and remote (Render PostgreSQL)
      # Development (local): Uses postgres service from this compose file
      # Production (Render): Override DATABASE_URL with Render connection string
      DATABASE_URL: ${DATABASE_URL:-Host=postgres;Database=housedb;Username=houseadmin;Password=demo123456;Port=5432}
      ConnectionStrings__DefaultConnection: ${DATABASE_URL:-Host=postgres;Database=housedb;Username=houseadmin;Password=demo123456;Port=5432}
      
      # Authentication and landlord credentials
      Jwt__Secret: ${JWT_SECRET:-your-32-character-minimum-jwt-secret-key-here}
      Landlord__Email: ${LANDLORD_EMAIL:-landlord@housedemoll.com}
      Landlord__PasswordHash: ${LANDLORD_PASSWORD_HASH:-$2a$11$361iDHFu5B80.65OdgiqhOxRXoBihMl3MSDWznlRNk7c04hzHyiSS}
    ports:
      - "5088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - housedemo-network
    restart: unless-stopped

networks:
  housedemo-network:
    driver: bridge

volumes:
  postgres_data:

# Usage Examples:
#
# 1. Local Development (use local postgres in docker-compose):
#    docker-compose up
#    Connects to: postgres://houseadmin:demo123456@postgres:5432/housedb
#
# 2. Test with Render PostgreSQL (production database):
#    DATABASE_URL="postgres://user:password@your-render-host:5432/your-dbname" \
#    ASPNETCORE_ENVIRONMENT="Production" \
#    docker-compose up
#    Connects to: Render's PostgreSQL instance
#
# 3. Both options support hot reload via docker-compose
#    Changes are reflected immediately without container restart
